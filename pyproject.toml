[project]
name = "api-controla-ai"
version = "0.1.0"
description = "API de gestão financeira e patrimonial com ingestão automatizada de comprovantes"
readme = "README.md"
requires-python = "==3.14.*"
license = { text = "MIT" }

dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.1",
    "uvicorn-worker==0.4.0",
    "gunicorn==26.0.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "asyncpg==0.31.0",
    "pgvector==0.5.0",
    "redis[hiredis]==5.2.1",
    "arq==0.28.0",
    "jwcrypto==1.5.8",
    "pytesseract==0.3.13",
    "pdf2image==1.17.0",
    "pillow==12.3.0",
    "httpx==0.28.1",
    "structlog==26.1.0",
]

[dependency-groups]
dev = [
    "ruff==0.15.4",
    "mypy==1.20.0",
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
    "pytest-cov==7.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ─── uv ──────────────────────────────────────────────────────
[tool.uv]
required-version = ">=0.9.0"

# ─── Ruff — lint e formatação (PEP 8) ────────────────────────
[tool.ruff]
line-length = 88
target-version = "py314"
src = ["app"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "ASYNC",# flake8-async
    "S",    # flake8-bandit
    "T20",  # flake8-print
    "RUF",  # ruff-specific
]
ignore = [
    "S101",  # assert é legítimo em testes
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "T20"]
"app/config/settings.py" = ["N815"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ─── mypy — verificação estática de tipos ────────────────────
[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pgvector.*", "pytesseract.*", "pdf2image.*"]
ignore_missing_imports = true

# ─── pytest ──────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=app --cov-report=term-missing"

[tool.coverage.run]
source = ["app"]
omit = ["*/__init__.py"]
